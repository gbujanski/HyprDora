# akmods shows "Building" and "Installing" on the boot splash, but never hides them, as its check for a
# message to hide is the wrong way round; the splash would say a driver is building until the login screen.
# Once it is done, each is hidden here. A failure's message stays.
[Service]
ExecStartPost=-/bin/sh -c '/usr/bin/plymouth --ping || exit 0; for f in /usr/src/akmods/*-kmod.latest; do for step in Building Installing; do /usr/bin/plymouth hide-message --text="akmod: $$step $$f..."; done; done'
