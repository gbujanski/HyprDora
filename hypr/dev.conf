# Minimal config for `make dev`. Replaced by the Lua config in stage 2.
# ALT is the modifier, because the outer session captures SUPER.

monitor = , preferred, auto, 1

exec-once = qs -p $HYPRDORA_SHELL

bind = ALT, A, exec, qs -p $HYPRDORA_SHELL ipc call actioncenter toggle
bind = ALT, Escape, exec, qs -p $HYPRDORA_SHELL ipc call powermenu toggle
bind = ALT, Return, exec, alacritty
bind = ALT, Q, killactive
