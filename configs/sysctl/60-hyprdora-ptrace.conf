# A program may read another's memory with ptrace only when it started that program, as a debugger does,
# so a program running as the user cannot read a password from the shell, the keyring or a browser while
# they run. Attaching to a running program, such as gdb -p or strace -p, needs root. Fedora allows any
# program of the same user (10-default-yama-scope.conf); this file sorts after it, so its value is taken.
kernel.yama.ptrace_scope = 1
