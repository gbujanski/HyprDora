# Hyprland portal choice, as shipped by xdg-desktop-portal-hyprland, plus the HyprDora backend: the wallpaper,
# and the accent color ahead of xdg-desktop-portal-gtk's settings, which have no accent.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Wallpaper=hyprdora
org.freedesktop.impl.portal.Settings=hyprdora;gtk
