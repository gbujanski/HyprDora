# HyprDora's tmux settings. The key bindings are tmux's own: each starts with Ctrl+b, and Ctrl+b ? lists them.
# ~/.config/tmux/tmux.conf is read after this file and can change anything here.

# The wheel scrolls the history, a click picks a tab or a pane; Shift with the mouse selects as in Alacritty.
set -g mouse on
# Tabs and panes count from 1, as the number keys do, and close their gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# What Neovim needs inside tmux: Esc without a delay, focus events to reload changed files, and full colour.
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
