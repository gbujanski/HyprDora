# Anaconda's profile for HyprDora: Fedora's, with HyprDora's look. The ISO's boot entries pick it with
# inst.profile=hyprdora, since the installer itself still runs on Fedora's os-release. The EFI directory
# stays Fedora's, where Fedora's shim and GRUB packages install themselves.

[Profile]
profile_id = hyprdora
base_profile = fedora

[Profile Detection]
os_id = hyprdora

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/hyprdora.css
