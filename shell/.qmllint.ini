; Read by qmllint (make lint) and by qmlls in an editor, so both report the same. Neither can see Quickshell's
; types or the shell's own qs.* modules, so these categories would only report noise.
[Warnings]
ImportFailure=disable
UnqualifiedAccess=disable
UnresolvedType=disable
MissingType=disable
MissingProperty=disable
UncreatableType=disable
RequiredProperty=disable
BadSignalHandlerParameters=disable
IncompatibleType=disable
