general {
    # The lock screen is part of the shell.
    lock_cmd = qs -c hyprdora ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    # Sleep waits until the screen is locked, so the desktop never shows on wake.
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}